<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Cajero</title>
<meta name="theme-color" content="#0d3b66">
<meta name="apple-mobile-web-app-title" content="Mi Cajero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--fascia:#dfe5ea;--bezel:#2b3138;--screen:#0d3b66;--screen2:#145088;--ink:#f4f8fb;--soft:#a9c4dd;--gold:#ffc53d;--ok:#6fe0a0;--bad:#ff8a7a;--key:#f6f8fa;--keyink:#1d2730;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fascia:#20262c;--bezel:#0f1215;--key:#39424b;--keyink:#eef2f5}}
:root[data-theme="dark"]{--fascia:#20262c;--bezel:#0f1215;--key:#39424b;--keyink:#eef2f5}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--fascia);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:14px}
.atm{width:100%;max-width:560px}
.slot{height:10px;width:55%;margin:0 auto 12px;background:var(--bezel);border-radius:6px;box-shadow:inset 0 3px 4px #0008}
.bezel{background:var(--bezel);padding:14px;border-radius:18px}
.screen{background:linear-gradient(180deg,var(--screen2),var(--screen));border-radius:8px;min-height:430px;padding:18px;display:flex;flex-direction:column;gap:12px}
h1{font-size:1.35rem;margin:0}
h2{font-size:1.05rem;margin:6px 0 0;color:var(--gold)}
p{margin:0;color:var(--soft);line-height:1.4}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid #ffffff30;padding-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
button,.opt{font:inherit;cursor:pointer}
.opt{background:#ffffff14;color:var(--ink);border:1px solid #ffffff40;border-left:6px solid var(--gold);border-radius:6px;padding:13px 12px;text-align:left;min-height:50px;width:100%}
.opt:hover{background:#ffffff26}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt small{display:block;color:var(--soft);margin-top:2px}
.opt.exit{border-left-color:var(--bad)}
.opt.back{border-left-color:var(--soft)}
.list{display:flex;flex-direction:column;gap:8px}
input{font:inherit;width:100%;padding:12px;border-radius:6px;border:2px solid #ffffff55;background:#06223c;color:var(--ink);font-size:1.2rem}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label{color:var(--soft);font-size:.9rem;display:block;margin-bottom:4px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.msg{padding:10px 12px;border-radius:6px;background:#00000040}
.msg.ok{color:var(--ok);border-left:5px solid var(--ok)}
.msg.err{color:var(--bad);border-left:5px solid var(--bad)}
.big{font-size:1.9rem;font-weight:700}
.line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed #ffffff30}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.prog{height:12px;background:#00000050;border-radius:6px;overflow:hidden;margin:6px 0}
.prog>i{display:block;height:100%;background:var(--gold)}
.card{background:#00000030;border-radius:8px;padding:12px}
.dots{display:flex;gap:14px;justify-content:center;margin:12px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--gold)}
.dots i.on{background:var(--gold)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px auto 0;max-width:300px}
.key{background:var(--key);color:var(--keyink);border:0;border-radius:8px;padding:16px 0;font-size:1.3rem;font-weight:700;box-shadow:0 3px 0 #0006}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #0006}
.key.ok{background:#3da56a;color:#fff}.key.no{background:#d65a4a;color:#fff}
.tiny{font-size:.85rem}
.al{padding:10px 12px;border-radius:6px;background:#00000040;border-left:6px solid;line-height:1.35;cursor:pointer}
.al.g{border-color:var(--ok)}.al.g b{color:var(--ok)}
.al.o{border-color:#ffa94d}.al.o b{color:#ffa94d}
.al.r{border-color:var(--bad);background:#8a221680}.al.r b{color:#ffd9d3}
.logo{width:34px;height:34px;flex:0 0 auto;display:block}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px}
.brand .logo{width:84px;height:84px}
.brand b{font-size:1.5rem;letter-spacing:.04em}
.ttl{display:flex;align-items:center;gap:10px}
textarea{font:inherit;width:100%;padding:10px;border-radius:6px;border:2px solid #ffffff55;background:#06223c;color:var(--ink);min-height:70px;font-size:.85rem}
</style>
</head>
<body>
<div class="atm">
  <div class="slot"></div>
  <div class="bezel"><div class="screen" id="screen" aria-live="polite"></div></div>
  <div id="keypad"></div>
</div>
<script>
const KEY='cajero_finanzas_v1';
const fresh=()=>({pin:'1234',debit:0,savings:0,debtSavings:0,cards:[],goals:[],tx:[]});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const $=id=>document.getElementById(id);
const money=n=>(n<0?'-':'')+Math.abs(n).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let scr='pin',f={},msg=null,pinBuf='';

function go(s,o,m){scr=s;f=o||{};msg=m||null;render();}
function log(text,amt,sign){S.tx.unshift({d:new Date().toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),text,amt,sign});S.tx=S.tx.slice(0,100);}
function amt(){const v=parseFloat(($('amt')||{}).value);return isFinite(v)&&v>0?Math.round(v*100)/100:0;}
const M=()=>msg?`<div class="msg ${msg.k}">${msg.t}</div>`:'';
const back=(to='menu',label='Volver al menú')=>`<button class="opt back" onclick="go('${to}')">${label}</button>`;
const debtTotal=()=>S.debtSavings+S.cards.reduce((a,c)=>a+(c.saved||0),0);
const r2=n=>Math.round(n*100)/100;
const DAY=864e5;
const todayD=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dim=k=>new Date(Math.floor(k/12),k%12+1,0).getDate();
const dateIn=(k,day)=>new Date(Math.floor(k/12),k%12,Math.min(day,dim(k)));
const fdate=d=>d.toLocaleDateString('es-MX',{day:'numeric',month:'long'});
const mlabel=k=>new Date(Math.floor(k/12),k%12,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'});
const hasDates=c=>c.cutDay>0&&c.dueDay>0;
const cycleOf=(c,s)=>{const [y,m,d]=s.split('-').map(Number),k=y*12+m-1;return d<=(c.cutDay||31)?k:k+1;};
const cutOf=(c,k)=>dateIn(k,c.cutDay);
const dueOf=(c,k)=>dateIn(c.dueDay>c.cutDay?k:k+1,c.dueDay);
const nOf=b=>b.msi>1?b.msi:1;
function cycleDue(c,k){let t=0;(c.buys||[]).forEach(b=>{const ci=cycleOf(c,b.d),n=nOf(b);if(k>=ci&&k<ci+n)t+=b.amt/n;});return r2(t);}
function activeK(c){if(!hasDates(c))return null;const T=todayD(),k0=T.getFullYear()*12+T.getMonth();return T>=cutOf(c,k0)?k0:k0-1;}
function dispK(c){const k=activeK(c);return k===null?null:(c.paidCycle>=k?k+1:k);}
function monthDebt(c){
  const K=activeK(c);if(K===null)return null;
  const k=dispK(c),cur=k>K;
  if(c.paidCycle>=k)return {k,amt:0,paid:true,cur};
  const man=!!(c.rest&&c.rest.k===k);
  return {k,amt:man?c.rest.amt:cycleDue(c,k),paid:false,man,cur};
}
function mdLine(c){
  const m=monthDebt(c);
  if(!m)return `<div class="tiny" style="color:var(--soft);margin-top:4px">Deuda del mes: agrega las fechas de corte y pago para verla.</div>`;
  const none=!m.paid&&!m.cur&&m.amt<=0;
  const ttl=m.cur?'Deuda del nuevo mes':'Deuda del mes a pagar';
  const sub=m.paid?`Pagada. Cuando llegue el corte del ${fdate(cutOf(c,m.k))} pasará a la deuda del siguiente mes.`:m.cur?`Mes en curso: corta el ${fdate(cutOf(c,m.k))} y se va sumando con tus compras.`:none?'Escribe abajo cuánto falta pagar este mes.':`Fecha límite: ${fdate(dueOf(c,m.k))}`;
  return `<div class="line" style="border:0;padding:6px 0 0"><span>${ttl} · corte del ${fdate(cutOf(c,m.k))}</span><b class="${m.paid?'pos':none?'':'neg'}">${m.paid?'Pagada':none?'Sin dato':money(m.amt)}</b></div><div class="tiny" style="color:var(--soft)">${sub}</div>`;
}
function alertOf(c){
  const k=activeK(c);if(k===null||c.paidCycle>=k||c.debt<=0)return null;
  const left=Math.round((dueOf(c,k)-todayD())/DAY);
  return {k,left,lv:left<=3?'r':left<=7?'o':'g'};
}
function alerts(){
  return S.cards.map(c=>{
    const a=alertOf(c);if(!a)return '';
    const n=esc(c.name),df=fdate(dueOf(c,a.k)),due=cycleDue(c,a.k);
    let t=a.lv==='g'?`Tu tarjeta <b>${n}</b> ya cortó. Debes pagarla antes del <b>${df}</b>.`
      :a.lv==='o'?`Se acerca la fecha límite de <b>${n}</b>: <b>${df}</b> (faltan ${a.left} días).`
      :a.left<0?`⚠ <b>¡Pago vencido!</b> ${n} venció hace ${-a.left} día(s). Paga lo antes posible para evitar intereses y recargos.`
      :`⚠ <b>¡Atención!</b> La fecha límite de ${n} es ${a.left===0?'<b>hoy</b>':a.left===1?'<b>mañana</b>':'en <b>'+a.left+' días</b>'} (${df}). Paga ya para evitar intereses.`;
    t+=c.rest&&c.rest.k===a.k?` Te faltan <b>${money(c.rest.amt)}</b> de tu pago del mes.`:due>0?` Pago del mes: <b>${money(due)}</b>.`:'';
    return `<div class="al ${a.lv}" role="button" onclick="go('pay1')">${t}<div class="tiny" style="margin-top:4px;color:var(--soft)">Toca para pagar con el ahorro de la tarjeta</div></div>`;
  }).join('');
}
function cardTools(c){
  const bt='style="flex:0 0 auto;width:auto;min-height:44px;padding:6px 10px"',inp='type="number" inputmode="numeric" style="font-size:.95rem"';
  let h=`<div class="tiny" style="color:var(--soft);margin-top:6px">${hasDates(c)?`Corte: día ${c.cutDay} · Límite de pago: día ${c.dueDay}`:'Sin fechas de corte y pago'}</div>
  <div class="row" style="margin-top:6px"><input id="cut_${c.id}" ${inp} min="1" max="31" placeholder="Día de corte" value="${c.cutDay||''}"><input id="due_${c.id}" ${inp} min="1" max="31" placeholder="Día límite" value="${c.dueDay||''}"><button class="opt" ${bt} onclick="saveDates('${c.id}')">Guardar fechas</button></div>`;
  if(hasDates(c))h+=`<div class="row" style="margin-top:6px"><input id="rst_${c.id}" type="number" inputmode="decimal" placeholder="Falta pagar este mes" style="font-size:.95rem"><button class="opt" ${bt} onclick="saveRest('${c.id}')">Guardar</button></div><button class="opt" style="margin-top:6px;min-height:36px;padding:6px 10px" onclick="markPaid('${c.id}')">Ya pagué el mes</button>`;
  return h+`<button class="opt" style="margin-top:6px;min-height:36px;padding:6px 10px" onclick="go('stmt',{id:'${c.id}'})">Compras por mes</button>`;
}
const LOGO='<svg class="logo" viewBox="0 0 100 100" role="img" aria-label="Mi Cajero"><rect width="100" height="100" rx="22" fill="#0d3b66"/><rect x="10" y="10" width="80" height="80" rx="16" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/><circle cx="50" cy="48" r="27" fill="#ffc53d"/><circle cx="50" cy="48" r="21" fill="none" stroke="#0d3b66" stroke-width="2"/><text x="50" y="59" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="30" fill="#0d3b66">$</text><rect x="30" y="78" width="40" height="5" rx="2.5" fill="#fff" fill-opacity=".8"/></svg>';
const bar=(t,s='')=>`<div class="bar"><div class="ttl">${LOGO}<h1>${t}</h1></div><span class="tiny" style="color:var(--soft)">${s}</span></div>`;

function render(){
  let h='';
  $('keypad').innerHTML='';
  if(scr==='pin'){
    h=`<div class="brand">${LOGO}<b>MI CAJERO</b></div><p style="text-align:center">Ingresa tu NIP de 4 dígitos</p><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div>${M()}`;
    $('keypad').innerHTML=`<div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="pk('${n}')">${n}</button>`).join('')}<button class="key no" onclick="pk('c')" aria-label="Borrar">⌫</button><button class="key" onclick="pk('0')">0</button><button class="key ok" onclick="pk('e')">OK</button></div><p class="tiny" style="text-align:center;margin-top:8px;color:var(--keyink)">NIP inicial: 1234 (puedes cambiarlo en Ajustes)</p>`;
  }
  else if(scr==='menu'){
    const debt=S.cards.reduce((a,c)=>a+c.debt,0);
    h=bar('¿Qué deseas hacer?')+M()+alerts()+`<div class="grid">
      <button class="opt" onclick="go('dep1')">Ingresar dinero<small>Ahorro, tarjeta, objetivo</small></button>
      <button class="opt" onclick="go('wd1')">Retirar o comprar<small>Con ahorro o tarjeta</small></button>
      <button class="opt" onclick="go('acc')">Mis cuentas<small>Saldos y tarjetas</small></button>
      <button class="opt" onclick="go('goals')">Mis objetivos<small>${S.goals.length} en curso</small></button>
      <button class="opt" onclick="go('hist')">Movimientos<small>Historial</small></button>
      <button class="opt" onclick="go('set')">Ajustes<small>NIP y datos</small></button>
      <button class="opt exit" style="grid-column:1/-1" onclick="pinBuf='';go('pin')">Salir y retirar tarjeta</button></div>
      <div class="card tiny"><div class="line"><span>Ahorros</span><b>${money(S.savings)}</b></div><div class="line"><span>Tarjeta de débito</span><b>${money(S.debit)}</b></div><div class="line"><span>Ahorro para deudas</span><b>${money(debtTotal())}</b></div><div class="line" style="border:0"><span>Deuda en tarjetas</span><b class="${debt?'neg':''}">${money(debt)}</b></div></div>`;
  }
  else if(scr==='dep1'||scr==='wd2'){
    const dep=scr==='dep1';
    h=bar(dep?'Ingresar dinero':(f.type==='compra'?'Registrar compra':'Retirar dinero'))+M()+
    `<div><label for="amt">Monto</label><input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${f.amount||''}" autofocus></div>
     <div><label for="note">${dep?'Concepto (opcional)':(f.type==='compra'?'¿Qué compraste?':'Concepto (opcional)')}</label><input id="note" type="text" maxlength="40" value="${esc(f.note||'')}" style="font-size:1rem"></div>
     <button class="opt" onclick="step2('${dep?'dep2':'wd3'}')">Continuar</button>${back()}`;
  }
  else if(scr==='dep2'){
    h=bar('¿A dónde va el dinero?',money(f.amount))+M()+`<div class="list">
      <button class="opt" onclick="deposit('savings')">Ahorros<small>Saldo ${money(S.savings)}</small></button>
      <button class="opt" onclick="go('dep3',f)">Ahorro para pagar deudas<small>Total ${money(debtTotal())} · elegirás la tarjeta</small></button>
      <button class="opt" onclick="deposit('debit')">Depósito a tarjeta de débito<small>Saldo ${money(S.debit)}</small></button>
      <button class="opt back" onclick="go('dep1',f)">Cambiar monto</button></div>`;
  }
  else if(scr==='wd4'){
    const c=S.cards.find(x=>x.id===f.cardId);
    h=bar('¿Cómo pagarás?',money(f.amount))+M()+`<p>Tarjeta ${esc(c.name)}</p><div class="grid">${[0,3,6,9,12,18,24].map(n=>`<button class="opt" onclick="withdraw('card','${c.id}',${n})">${n?n+' meses sin intereses':'De contado'}${n?`<small>${money(f.amount/n)} al mes</small>`:''}</button>`).join('')}</div><button class="opt back" onclick="go('wd3',f)">Regresar</button>`;
  }
  else if(scr==='stmt'){
    const c=S.cards.find(x=>x.id===f.id),bs=c.buys||[],ks=new Set();
    bs.forEach(b=>{const ci=cycleOf(c,b.d);for(let i=0;i<nOf(b);i++)ks.add(ci+i);});
    const arr=[...ks].sort((a,b)=>b-a).slice(0,18);
    h=bar('Compras por mes',esc(c.name))+`<p class="tiny">Cada compra cuenta en el corte al que pertenece. Las compras a meses se reparten en mensualidades. Tu saldo anterior sin detalle no se incluye aquí.</p>`+(arr.length?arr.map(k=>{
      const items=bs.filter(b=>{const ci=cycleOf(c,b.d);return k>=ci&&k<ci+nOf(b);});
      return `<div class="card"><div class="line" style="border:0;padding-top:0"><b>Corte de ${mlabel(k)}</b><b>${money(cycleDue(c,k))}</b></div>${hasDates(c)?`<div class="tiny" style="color:var(--soft)">Fecha límite: ${fdate(dueOf(c,k))}</div>`:''}${items.map(b=>`<div class="line tiny"><span>${esc(b.text)}${nOf(b)>1?` · mensualidad ${k-cycleOf(c,b.d)+1}/${nOf(b)}`:''}</span><span>${money(b.amt/nOf(b))}</span></div>`).join('')}</div>`;}).join(''):'<p>Aún no hay compras registradas con esta tarjeta.</p>')+back('acc','Volver a cuentas');
  }
  else if(scr==='pay1'){
    h=bar('Pagar tarjeta')+M()+`<p>Elige la tarjeta. Se pagará lo que tengas ahorrado para ella.</p><div class="list">${S.cards.length?S.cards.map(c=>{const a=r2(Math.min(c.saved||0,c.debt));return `<button class="opt" ${a>0?'':'disabled'} onclick="payFromSaved('${c.id}','menu')">Tarjeta ${esc(c.name)}<small>Ahorrado ${money(c.saved||0)} · Debes ${money(c.debt)}${a>0?' · Se pagarán '+money(a):(c.debt<=0?' · Sin deuda':' · Sin ahorro')}</small></button>`}).join(''):'<p>Aún no tienes tarjetas. Agrégalas en "Mis cuentas".</p>'}${back('wd1','Regresar')}</div>`;
  }
  else if(scr==='dep3'){
    h=bar('¿Para qué tarjeta es el ahorro?',money(f.amount))+M()+`<div class="list">${S.cards.length?S.cards.map(c=>`<button class="opt" onclick="deposit('cardSave','${c.id}')">Tarjeta ${esc(c.name)}<small>Ahorrado ${money(c.saved||0)} · Debes ${money(c.debt)}</small></button>`).join(''):'<p>Primero agrega una tarjeta en "Mis cuentas".</p>'}<button class="opt back" onclick="go('dep2',f)">Regresar</button></div>`;
  }
  else if(scr==='wd1'){
    h=bar('Retirar o comprar')+M()+`<p>¿Qué tipo de movimiento es?</p><div class="grid">
      <button class="opt" onclick="go('wd2',{type:'retiro'})">Retiro<small>Sacar efectivo</small></button>
      <button class="opt" onclick="go('wd2',{type:'compra'})">Compra<small>Algo que pagaste</small></button>
      <button class="opt" style="grid-column:1/-1" onclick="go('pay1')">Pagar tarjeta<small>Se paga con el ahorro de la tarjeta que elijas</small></button></div>${back()}`;
  }
  else if(scr==='wd3'){
    const a=f.amount;
    h=bar(`¿De dónde sale?`,money(a))+M()+`<div class="list">
      <button class="opt" ${S.savings<a?'disabled':''} onclick="withdraw('savings')">Ahorros<small>Saldo ${money(S.savings)}</small></button>
      <button class="opt" ${S.debit<a?'disabled':''} onclick="withdraw('debit')">Tarjeta de débito<small>Saldo ${money(S.debit)}</small></button>
      ${S.cards.map(c=>{const no=c.limit>0&&c.debt+a>c.limit;return `<button class="opt" ${no?'disabled':''} onclick="cardPick('${c.id}')">Tarjeta de crédito ${esc(c.name)}<small>${no?'Excede tu límite':'Deuda actual '+money(c.debt)}${c.limit>0&&!no?' · Disponible '+money(c.limit-c.debt):''}</small></button>`}).join('')}
      <button class="opt back" onclick="go('wd2',f)">Cambiar monto</button></div>`;
  }
  else if(scr==='acc'){
    h=bar('Mis cuentas')+M()+`<div class="card"><div class="line"><span>Ahorros</span><b class="pos">${money(S.savings)}</b></div><div class="line"><span>Tarjeta de débito</span><b class="pos">${money(S.debit)}</b></div><div class="line" style="border:0"><span>Ahorro para pagar deudas (total)</span><b class="pos">${money(debtTotal())}</b></div></div>
    ${S.debtSavings>0?`<div class="card"><div class="line" style="border:0"><span>Ahorro para deudas sin asignar</span><b>${money(S.debtSavings)}</b></div><p class="tiny" style="margin-bottom:6px">Asígnalo a una tarjeta:</p><div class="list">${S.cards.map(c=>`<button class="opt" style="min-height:40px;padding:8px 10px" onclick="assignLegacy('${c.id}')">Pasar a ${esc(c.name)}</button>`).join('')||'<p class="tiny">Agrega una tarjeta primero.</p>'}</div></div>`:''}
    <h2>Tarjetas de crédito</h2>
    ${S.cards.length?S.cards.map(c=>{const p=c.limit>0?Math.min(100,c.debt/c.limit*100):0;return `<div class="card"><div class="line" style="border:0"><b>${esc(c.name)}</b><span class="${c.debt?'neg':'pos'}">Debes ${money(c.debt)}</span></div>${c.limit>0?`<div class="prog"><i style="width:${p}%"></i></div><span class="tiny">Límite ${money(c.limit)} · usado ${p.toFixed(0)}%</span>`:''}<div class="tiny" style="color:var(--soft);margin-top:6px">Ahorro para esta tarjeta: <b class="pos">${money(c.saved||0)}</b></div>${mdLine(c)}${cardTools(c)}<div class="row" style="margin-top:6px"><button class="opt" style="min-height:36px;padding:6px 10px" ${(c.saved||0)>0&&c.debt>0?'':'disabled'} onclick="payFromSaved('${c.id}')">Pagar con su ahorro</button><button class="opt exit" style="min-height:36px;padding:6px 10px" onclick="delCard('${c.id}')">Eliminar tarjeta</button></div></div>`}).join(''):'<p>Aún no tienes tarjetas. Agrega una abajo.</p>'}
    <div class="card"><label for="cn">Nueva tarjeta</label><input id="cn" placeholder="Nombre (ej. BBVA)" style="font-size:1rem;margin-bottom:8px"><div class="row"><input id="cd" type="number" inputmode="decimal" placeholder="Deuda actual" style="font-size:1rem"><input id="cl" type="number" inputmode="decimal" placeholder="Límite (opcional)" style="font-size:1rem"></div><div class="row" style="margin-top:8px"><input id="cc" type="number" inputmode="numeric" min="1" max="31" placeholder="Día de corte" style="font-size:1rem"><input id="cp" type="number" inputmode="numeric" min="1" max="31" placeholder="Día límite de pago" style="font-size:1rem"></div><button class="opt" style="margin-top:8px" onclick="addCard()">Agregar tarjeta</button></div>${back()}`;
  }
  else if(scr==='goals'){
    h=bar('Mis objetivos')+M()+(S.goals.length?S.goals.map(g=>{const p=g.target>0?Math.min(100,g.saved/g.target*100):0;return `<div class="card"><div class="line" style="border:0;padding-bottom:0"><b>${esc(g.name)}</b><span>${p.toFixed(0)}%</span></div><div class="prog"><i style="width:${p}%"></i></div><div class="tiny" style="color:var(--soft)">${money(g.saved)} de ${money(g.target)} · faltan ${money(Math.max(0,g.target-g.saved))}</div>
      <div class="row" style="margin-top:8px"><input id="g_${g.id}" type="number" inputmode="decimal" placeholder="Monto" style="font-size:1rem"><button class="opt" style="width:auto;flex:0 0 auto" onclick="contrib('${g.id}')">Abonar desde ahorros</button></div>
      <button class="opt exit" style="margin-top:8px;min-height:36px;padding:6px 10px" onclick="delGoal('${g.id}')">Eliminar (lo ahorrado regresa a Ahorros)</button></div>`}).join(''):'<p>Aún no tienes objetivos. Crea el primero: un viaje, un fondo de emergencia, un coche…</p>')+
    `<div class="card"><label for="gn">Nuevo objetivo</label><input id="gn" placeholder="Nombre" maxlength="40" style="font-size:1rem;margin-bottom:8px"><input id="gt" type="number" inputmode="decimal" placeholder="Meta en pesos" style="font-size:1rem"><button class="opt" style="margin-top:8px" onclick="addGoal()">Crear objetivo</button></div>${back()}`;
  }
  else if(scr==='hist'){
    h=bar('Movimientos','Últimos '+Math.min(S.tx.length,30))+(S.tx.length?`<div>${S.tx.slice(0,30).map(t=>`<div class="line"><span>${esc(t.text)}<br><span class="tiny" style="color:var(--soft)">${t.d}</span></span><b class="${t.sign>0?'pos':t.sign<0?'neg':''}">${t.sign>0?'+':t.sign<0?'-':''}${money(t.amt)}</b></div>`).join('')}</div>`:'<p>Todavía no hay movimientos.</p>')+back();
  }
  else if(scr==='set'){
    h=bar('Ajustes')+M()+`<div class="card"><label for="np">Nuevo NIP (4 dígitos)</label><input id="np" type="password" inputmode="numeric" maxlength="4" style="margin-bottom:8px"><button class="opt" onclick="chPin()">Cambiar NIP</button></div>
    <div class="card"><h2 style="margin:0 0 6px">Respaldo de datos</h2><p class="tiny" style="margin-bottom:8px">Guarda una copia de tus saldos, tarjetas, objetivos y movimientos. No incluye tu NIP.</p>
      <div class="row"><button class="opt" onclick="exportData()">Exportar archivo</button><button class="opt" onclick="copyData()">Copiar JSON</button></div>
      <label for="imp" style="margin-top:10px">Importar respaldo (.json)</label><input id="imp" type="file" accept=".json,application/json" onchange="importFile(this)" style="font-size:.9rem">
      <label for="pt" style="margin-top:10px">O pega aquí el JSON</label><textarea id="pt" placeholder='{"app":"mi-cajero",...}'></textarea>
      <button class="opt" style="margin-top:8px" onclick="importText()">Importar texto pegado</button>
      ${f.pending?`<div class="msg" style="margin-top:10px">Respaldo listo: ahorros ${money(f.pending.savings)}, ahorro para deudas ${money(f.pending.debtSavings)}, ${f.pending.cards.length} tarjeta(s), ${f.pending.goals.length} objetivo(s), ${f.pending.tx.length} movimiento(s). Esto <b>reemplazará</b> tus datos actuales.</div><button class="opt exit" style="margin-top:8px" onclick="applyImport()">Sí, reemplazar mis datos</button>`:''}</div>
    <div class="card"><p class="tiny" style="margin-bottom:8px">Tus datos se guardan solo en este navegador.</p><button class="opt exit" onclick="resetAll()">${f.confirm?'Toca otra vez para borrar todo':'Borrar todos mis datos'}</button></div>${back()}`;
  }
  $('screen').innerHTML=h;
  const a=$('amt');if(a&&!a.value)a.focus();
}

function pk(k){
  if(k==='c')pinBuf=pinBuf.slice(0,-1);
  else if(k==='e'){chk();return;}
  else if(pinBuf.length<4)pinBuf+=k;
  msg=null;render();
  if(pinBuf.length===4)setTimeout(chk,150);
}
function chk(){
  if(pinBuf===S.pin){pinBuf='';go('menu');}
  else{pinBuf='';go('pin',{},{k:'err',t:'NIP incorrecto. Inténtalo de nuevo.'});}
}
document.addEventListener('keydown',e=>{
  if(scr!=='pin')return;
  if(/^\d$/.test(e.key))pk(e.key);else if(e.key==='Backspace')pk('c');else if(e.key==='Enter')pk('e');
});

function step2(next){
  const a=amt(),note=$('note').value.trim();
  const keep={type:f.type,amount:a,note};
  if(!a){go(scr,keep,{k:'err',t:'Escribe un monto mayor a cero.'});return;}
  go(next,keep);
}
function deposit(kind,id){
  const a=f.amount,n=f.note?` (${f.note})`:'';let t;
  if(kind==='savings'){S.savings+=a;t='Ingreso a Ahorros';}
  else if(kind==='debit'){S.debit=r2(S.debit+a);t='Depósito a tarjeta de débito';}
  else if(kind==='cardSave'){const c=S.cards.find(x=>x.id===id);c.saved=r2((c.saved||0)+a);t='Ahorro para tarjeta '+c.name;}
  else if(kind==='card'){const c=S.cards.find(x=>x.id===id);if(a>c.debt){go('dep2',f,{k:'err',t:`Solo debes ${money(c.debt)} en ${esc(c.name)}. Reduce el monto.`});return;}c.debt-=a;t='Pago de tarjeta '+c.name;}
  else{const g=S.goals.find(x=>x.id===id);g.saved+=a;t='Objetivo: '+g.name;}
  log(t+n,a,1);save();go('menu',{},{k:'ok',t:`Listo: ${money(a)} · ${esc(t)}.`});
}
function withdraw(kind,id,msi){
  const a=f.amount,compra=f.type==='compra',lab=compra?'Compra':'Retiro',n=f.note?`: ${f.note}`:'';let src;
  if(kind==='savings'){if(S.savings<a)return;S.savings-=a;src='Ahorros';}
  else if(kind==='debit'){if(S.debit<a)return;S.debit=r2(S.debit-a);src='Tarjeta de débito';}
  else{const c=S.cards.find(x=>x.id===id),m=compra&&msi>1?msi:0;c.debt=r2(c.debt+a);c.buys=c.buys||[];c.buys.push({id:uid(),d:iso(todayD()),text:f.note||lab,amt:a,msi:m});src='tarjeta '+c.name+(m?` a ${m} MSI`:'');const kc=cycleOf(c,iso(todayD()));if(c.paidCycle>=kc)c.paidCycle=kc-1;}
  log(`${lab}${n} · ${src}`,a,-1);save();
  go('menu',{},{k:'ok',t:`${lab} de ${money(a)} registrado con ${esc(src)}.`});
}
function addCard(){
  const n=$('cn').value.trim(),d=parseFloat($('cd').value)||0,l=parseFloat($('cl').value)||0;
  if(!n){go('acc',{},{k:'err',t:'Ponle un nombre a la tarjeta.'});return;}
  const cu=parseInt($('cc').value)||0,du=parseInt($('cp').value)||0,ok=v=>v>=1&&v<=31;
  if((cu||du)&&!(ok(cu)&&ok(du))){go('acc',{},{k:'err',t:'Pon día de corte y día límite entre 1 y 31, o deja ambos vacíos.'});return;}
  S.cards.push({id:uid(),name:n,debt:Math.max(0,d),limit:Math.max(0,l),saved:0,cutDay:cu,dueDay:du,buys:[]});save();go('acc',{},{k:'ok',t:'Tarjeta agregada.'});
}
function delCard(id){
  const c=S.cards.find(x=>x.id===id);
  if(c&&c.saved>0){S.savings=r2(S.savings+c.saved);log('Ahorro de tarjeta eliminada ('+c.name+') regresa a Ahorros',c.saved,0);}
  S.cards=S.cards.filter(x=>x.id!==id);save();go('acc',{},{k:'ok',t:'Tarjeta eliminada.'+(c&&c.saved>0?' Su ahorro regresó a Ahorros.':'')});
}
function payFromSaved(id,to){
  to=to||'acc';
  const c=S.cards.find(x=>x.id===id),a=r2(Math.min(c.saved||0,c.debt));
  if(a<=0){go(to==='menu'?'pay1':to,{},{k:'err',t:'No hay ahorro o deuda para aplicar.'});return;}
  c.saved=r2(c.saved-a);c.debt=r2(c.debt-a);log('Pago de '+c.name+' con su ahorro',a,0);save();
  let note='';const k0=dispK(c);
  if(k0!==null&&!(c.paidCycle>=k0)){const rem=c.rest&&c.rest.k===k0?c.rest.amt:cycleDue(c,k0);if(rem>0){const nr=r2(rem-a);if(nr<=0){c.paidCycle=k0;c.rest=null;note=' El pago del mes quedó cubierto.';}else{c.rest={k:k0,amt:nr};note=` Faltan ${money(nr)} de la deuda del mes.`;}}}
  save();
  go(to,{},{k:'ok',t:`Pagaste ${money(a)} de ${esc(c.name)} con su ahorro.`+(c.debt>0?` Aún debes ${money(c.debt)}.`:' ¡Tarjeta liquidada!')+note});
}
function cardPick(id){if(f.type==='compra')go('wd4',Object.assign({},f,{cardId:id}));else withdraw('card',id,0);}
function saveDates(id){
  const c=S.cards.find(x=>x.id===id),cu=parseInt($('cut_'+id).value)||0,du=parseInt($('due_'+id).value)||0,ok=v=>v>=1&&v<=31;
  if(!(ok(cu)&&ok(du))){go('acc',{},{k:'err',t:'Escribe día de corte y día límite entre 1 y 31.'});return;}
  c.cutDay=cu;c.dueDay=du;save();go('acc',{},{k:'ok',t:'Fechas guardadas para '+esc(c.name)+'.'});
}
function markPaid(id){const c=S.cards.find(x=>x.id===id);c.paidCycle=dispK(c);c.rest=null;save();go('acc',{},{k:'ok',t:'Listo: el pago del mes de '+esc(c.name)+' quedó marcado como pagado.'});}
function saveRest(id){
  const c=S.cards.find(x=>x.id===id),a=parseFloat($('rst_'+id).value);
  if(!(a>0)){go('acc',{},{k:'err',t:'Escribe cuánto falta pagar. Si ya no falta nada, toca "Ya pagué el mes".'});return;}
  c.rest={k:dispK(c),amt:r2(a)};save();go('acc',{},{k:'ok',t:`Anotado: faltan ${money(a)} de ${esc(c.name)}.`});
}
function assignLegacy(id){
  const c=S.cards.find(x=>x.id===id),a=S.debtSavings;
  c.saved=r2((c.saved||0)+a);S.debtSavings=0;log('Ahorro sin asignar pasa a '+c.name,a,0);save();
  go('acc',{},{k:'ok',t:`${money(a)} asignados a ${esc(c.name)}.`});
}
function addGoal(){
  const n=$('gn').value.trim(),t=parseFloat($('gt').value);
  if(!n||!(t>0)){go('goals',{},{k:'err',t:'Escribe un nombre y una meta mayor a cero.'});return;}
  S.goals.push({id:uid(),name:n,target:t,saved:0});save();go('goals',{},{k:'ok',t:'Objetivo creado.'});
}
function contrib(id){
  const g=S.goals.find(x=>x.id===id),a=parseFloat($('g_'+id).value);
  if(!(a>0)){go('goals',{},{k:'err',t:'Escribe un monto válido.'});return;}
  if(a>S.savings){go('goals',{},{k:'err',t:`Tus ahorros son ${money(S.savings)}. Ingresa dinero primero.`});return;}
  S.savings-=a;g.saved+=a;log('Abono a objetivo: '+g.name,a,0);save();go('goals',{},{k:'ok',t:`Abonaste ${money(a)} a ${esc(g.name)}.`});
}
function delGoal(id){
  const g=S.goals.find(x=>x.id===id);S.savings+=g.saved;if(g.saved)log('Objetivo eliminado: '+g.name,g.saved,0);
  S.goals=S.goals.filter(x=>x.id!==id);save();go('goals',{},{k:'ok',t:'Objetivo eliminado.'});
}
function chPin(){
  const p=$('np').value;
  if(!/^\d{4}$/.test(p)){go('set',{},{k:'err',t:'El NIP debe tener exactamente 4 números.'});return;}
  S.pin=p;save();go('set',{},{k:'ok',t:'NIP actualizado.'});
}
const num=v=>{v=Number(v);return isFinite(v)?v:0;};
function clean(o){
  if(!o||typeof o!=='object'||o.app!=='mi-cajero'||!o.data)throw new Error('formato');
  const d=o.data;
  return {debit:num(d.debit),savings:num(d.savings),debtSavings:num(d.debtSavings),
    cards:(Array.isArray(d.cards)?d.cards:[]).map(c=>({id:String(c.id||uid()),name:String(c.name||'Tarjeta').slice(0,40),debt:Math.max(0,num(c.debt)),limit:Math.max(0,num(c.limit)),saved:Math.max(0,num(c.saved)),cutDay:Math.min(31,Math.max(0,Math.floor(num(c.cutDay)))),dueDay:Math.min(31,Math.max(0,Math.floor(num(c.dueDay)))),paidCycle:c.paidCycle==null?null:num(c.paidCycle),rest:c.rest&&num(c.rest.amt)>0?{k:num(c.rest.k),amt:num(c.rest.amt)}:null,
      buys:(Array.isArray(c.buys)?c.buys:[]).slice(-300).map(b=>({id:String(b.id||uid()),d:/^\d{4}-\d{2}-\d{2}$/.test(b.d)?b.d:iso(todayD()),text:String(b.text||'Compra').slice(0,60),amt:Math.max(0,num(b.amt)),msi:Math.max(0,Math.floor(num(b.msi)))}))})),
    goals:(Array.isArray(d.goals)?d.goals:[]).map(g=>({id:String(g.id||uid()),name:String(g.name||'Objetivo').slice(0,40),target:Math.max(0,num(g.target)),saved:Math.max(0,num(g.saved))})),
    tx:(Array.isArray(d.tx)?d.tx:[]).slice(0,100).map(t=>({d:String(t.d||''),text:String(t.text||'').slice(0,120),amt:num(t.amt),sign:t.sign>0?1:t.sign<0?-1:0}))};
}
function payload(){const {pin,...data}=S;return JSON.stringify({app:'mi-cajero',version:1,exported:new Date().toISOString(),data},null,2);}
function exportData(){
  try{
    const b=new Blob([payload()],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download='mi-cajero-respaldo-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
    go('set',{},{k:'ok',t:'Respaldo generado. Revisa tus descargas. Si no aparece, usa "Copiar JSON".'});
  }catch(e){go('set',{},{k:'err',t:'No se pudo descargar. Usa "Copiar JSON".'});}
}
async function copyData(){
  try{await navigator.clipboard.writeText(payload());go('set',{},{k:'ok',t:'JSON copiado. Pégalo en un lugar seguro (notas, correo a ti mismo).'});}
  catch(e){go('set',{},{k:'err',t:'Tu navegador no permitió copiar. Usa "Exportar archivo".'});}
}
function stage(text){
  try{go('set',{pending:clean(JSON.parse(text))});}
  catch(e){go('set',{},{k:'err',t:'Ese archivo no parece un respaldo válido de Mi Cajero.'});}
}
function importFile(inp){
  const file=inp.files&&inp.files[0];if(!file)return;
  const r=new FileReader();r.onload=()=>stage(r.result);r.onerror=()=>go('set',{},{k:'err',t:'No se pudo leer el archivo.'});r.readAsText(file);
}
function importText(){const t=$('pt').value.trim();if(!t){go('set',{},{k:'err',t:'Pega primero el JSON.'});return;}stage(t);}
function applyImport(){
  if(!f.pending)return;
  S=Object.assign(fresh(),f.pending,{pin:S.pin});save();go('set',{},{k:'ok',t:'Respaldo importado correctamente.'});
}
function resetAll(){
  if(!f.confirm){go('set',{confirm:true});return;}
  S=fresh();save();pinBuf='';go('pin',{},{k:'ok',t:'Datos borrados. NIP: 1234.'});
}
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
</script>
